<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToolFence Dashboard</title>
    <!-- Use CDNs for instant hackathon UI without node_modules overhead -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white p-8">
    <div id="root"></div>

    <script type="text/babel">
        function Dashboard() {
            const [logs, setLogs] = React.useState([]);

            React.useEffect(() => {
                const fetchLogs = () => {
                    fetch('http://127.0.0.1:8000/api/v1/logs')
                        .then(res => res.json())
                        .then(data => setLogs(data))
                        .catch(err => console.error(err));
                };
                
                fetchLogs(); // Initial fetch
                const interval = setInterval(fetchLogs, 1000); // Live poll every second
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="max-w-5xl mx-auto font-mono">
                    <div className="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
                        <h1 className="text-3xl font-bold text-emerald-400">🛡️ ToolFence Audit Log</h1>
                        <div className="flex items-center space-x-2">
                            <span className="animate-pulse h-3 w-3 bg-emerald-500 rounded-full"></span>
                            <span className="text-slate-400 text-sm">Security Gateway Active</span>
                        </div>
                    </div>

                    <div className="space-y-4">
                        {logs.length === 0 ? (
                            <div className="text-slate-500 text-center py-10 border border-dashed border-slate-700 rounded-lg">
                                Waiting for AI Agent activity... Run the simulator to see intercepts.
                            </div>
                        ) : logs.map((log, i) => (
                            <div key={i} className="bg-slate-800 p-5 rounded-lg border border-slate-700 shadow-xl transition-all">
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-slate-400 text-sm">
                                        {log.time} | Evaluated by: <span className="text-blue-400 font-semibold">{log.layer}</span>
                                    </span>
                                    <span className={`px-3 py-1 rounded text-sm font-bold shadow-sm ${
                                        log.decision === 'SAFE' ? 'bg-emerald-900 text-emerald-300 border border-emerald-700' :
                                        log.decision === 'UNSAFE' ? 'bg-red-900 text-red-300 border border-red-700' :
                                        'bg-amber-900 text-amber-300 border border-amber-700'
                                    }`}>
                                        {log.decision}
                                    </span>
                                </div>
                                <div className="text-lg text-slate-200 mb-3 bg-slate-900 p-2 rounded">
                                    <span className="text-fuchsia-400 select-none">$ </span>{log.command}
                                </div>
                                <div className="bg-black p-3 rounded text-sm text-slate-400 overflow-x-auto border-l-4 border-slate-700">
                                    {log.output || "No output returned."}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
